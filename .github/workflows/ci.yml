name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - '.idea/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE.txt'
      - '.idea/**'
      - '.gitignore'

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build jars
        run: ./gradlew test jar fatJar --console=plain
