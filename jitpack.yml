jdk: openjdk21
before_install:
  # NOTE: sdkman gradle archives are intermittently corrupt on JitPack builders
  # ("The archive was corrupt and has been removed"), so fetch the distribution
  # directly from services.gradle.org instead of `sdk install gradle`.
  - curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
  - rm -rf /tmp/gradle-9.8.0 && unzip -q -o /tmp/gradle.zip -d /tmp
  - /tmp/gradle-9.8.0/bin/gradle --version
install:
  - /tmp/gradle-9.8.0/bin/gradle build publishToMavenLocal -Pgroup=$GROUP -Pversion=$VERSION --console=plain --info
